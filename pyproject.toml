[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seikoclaw-harness"
version = "1.0.0"
description = "Modular Agentic Coding Harness with Persistent Memory, DAG Task Graph, and Cognitive Scaffolding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Saikojin" }
]
dependencies = [
    "chromadb>=0.4.0",
    "tiktoken>=0.5.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
localmind = [
    "llama-cpp-python>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
seikoclaw = "seikoclaw:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openbrain*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
